name: Build for CloudLinux 8 (EL8)

on:
  workflow_dispatch:

jobs:
  build:
    name: Compile Convex Backend
    runs-on: ubuntu-latest
    container: almalinux:8

    steps:
      - name: Install System Dependencies & C Compilers
        run: |
          dnf update -y
          dnf groupinstall "Development Tools" -y
          
          # We explicitly install python39 here instead of the default python3
          dnf install -y git cmake openssl-devel python39 wget curl
          
          # Force the system to use Python 3.9 as the default Python engine
          ln -sf /usr/bin/python3.9 /usr/bin/python3
          ln -sf /usr/bin/python3.9 /usr/bin/python
          
          # Install Node.js 24
          curl -fsSL https://rpm.nodesource.com/setup_24.x | bash -
          dnf install -y nodejs

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install 'just' Build Runner
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh | bash -s -- --to /usr/local/bin

      - name: Setup Convex Monorepo (via Just & Rush)
        run: |
          npm install --prefix scripts
          just rush install

      - name: Build Convex Backend (Release Mode)
        run: cargo build --release --bin convex-local-backend

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: convex-backend-el8
          path: target/release/convex-local-backend
          
