name: Release AlmaLinux Backend

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Create a GitHub release with the AlmaLinux 8 binary"
        required: false
        default: false
        type: boolean
      release_tag:
        description: "Optional release tag override"
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build AlmaLinux 8 backend
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Compute release metadata
        id: meta
        shell: bash
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          SHORT_SHA="$(git rev-parse --short=9 HEAD)"
          BUILD_DATE="$(date -u +'%Y-%m-%d')"
          RELEASE_NAME="AlmaLinux 8 ${BUILD_DATE}-${SHORT_SHA}"
          TARGET_TRIPLE="x86_64-unknown-linux-gnu"
          ZIP_NAME="convex-local-backend-${TARGET_TRIPLE}-almalinux8.zip"
          TAG_NAME="${INPUT_RELEASE_TAG:-almalinux8-${BUILD_DATE}-${SHORT_SHA}}"

          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "build_date=$BUILD_DATE" >> "$GITHUB_OUTPUT"
          echo "release_name=$RELEASE_NAME" >> "$GITHUB_OUTPUT"
          echo "target_triple=$TARGET_TRIPLE" >> "$GITHUB_OUTPUT"
          echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Write AlmaLinux Dockerfile
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/Dockerfile.almalinux" <<'EOF'
          # syntax=docker/dockerfile:1.7
          FROM almalinux:8 AS builder
          ARG VERGEN_GIT_SHA
          ARG VERGEN_GIT_COMMIT_TIMESTAMP
          ARG NODE_VERSION=22.22.2

          ENV HOME=/root
          ENV CARGO_HOME=/root/.cargo
          ENV RUSTUP_HOME=/root/.rustup
          ENV PATH=/root/.cargo/bin:/opt/node/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          ENV RUSH_BUILD_CACHE_ENABLED=0
          ENV AWS_LC_SYS_PREBUILT_NASM=1
          ENV VERGEN_GIT_SHA=${VERGEN_GIT_SHA}
          ENV VERGEN_GIT_COMMIT_TIMESTAMP=${VERGEN_GIT_COMMIT_TIMESTAMP}

          COPY rust-toolchain /tmp/rust-toolchain

          RUN dnf -y install \
              gcc gcc-c++ binutils make cmake clang llvm-devel \
              curl git tar xz which perl python3 pkgconf-pkg-config \
              findutils file ca-certificates \
           && dnf clean all

          RUN set -eux; \
           curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal; \
           toolchain="$(awk -F '\"' '/^channel[[:space:]]*=/{print $2; exit}' /tmp/rust-toolchain | tr -d '\r')"; \
           test -n "$toolchain"; \
           rustup toolchain install "$toolchain" --profile minimal; \
           rustup default "$toolchain"

          RUN curl -fsSLO "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.xz" \
           && mkdir -p /opt \
           && tar -xJf "node-v${NODE_VERSION}-linux-x64.tar.xz" -C /opt \
           && ln -s "/opt/node-v${NODE_VERSION}-linux-x64" /opt/node \
           && ln -sf /opt/node/bin/node /usr/local/bin/node \
           && ln -sf /opt/node/bin/npm /usr/local/bin/npm \
           && ln -sf /opt/node/bin/npx /usr/local/bin/npx \
           && rm -f "node-v${NODE_VERSION}-linux-x64.tar.xz"

          WORKDIR /convex
          COPY . .

          RUN npm ci --prefix scripts
          RUN ./scripts/rush_from_npm-packages.sh install
          RUN unset ROCKSDB_LIB_DIR SNAPPY_LIB_DIR SODIUM_USE_PKG_CONFIG \
           && cargo build --release -p local_backend --bin convex-local-backend \
           && strip target/release/convex-local-backend \
           && mkdir -p /out \
           && cp target/release/convex-local-backend /out/

          FROM scratch AS export
          COPY --from=builder /out/ /
          EOF

      - name: Build AlmaLinux binary
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist-almalinux8

          docker buildx build \
            --progress=plain \
            --platform linux/amd64 \
            --build-arg VERGEN_GIT_SHA="${GITHUB_SHA}" \
            --build-arg VERGEN_GIT_COMMIT_TIMESTAMP="$(git log -1 --format='%aI')" \
            --cache-from type=gha,scope=release-almalinux \
            --cache-to type=gha,mode=max,scope=release-almalinux \
            --target export \
            --output type=local,dest=./dist-almalinux8 \
            -f "$RUNNER_TEMP/Dockerfile.almalinux" .

      - name: Smoke test artifact on AlmaLinux 8
        shell: bash
        run: |
          set -euo pipefail
          test -x dist-almalinux8/convex-local-backend
          file dist-almalinux8/convex-local-backend
          docker run --rm \
            -v "$PWD/dist-almalinux8:/artifacts:ro" \
            almalinux:8 \
            bash -lc 'ldd /artifacts/convex-local-backend && /artifacts/convex-local-backend --help >/dev/null'

      - name: Package artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -f "${{ steps.meta.outputs.zip_name }}"
          zip -j "${{ steps.meta.outputs.zip_name }}" dist-almalinux8/convex-local-backend

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: convex-local-backend-almalinux8-x86_64
          path: |
            dist-almalinux8/convex-local-backend
            ${{ steps.meta.outputs.zip_name }}
          if-no-files-found: error

      - name: Create GitHub release
        if: ${{ inputs.publish_release }}
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          name: ${{ steps.meta.outputs.release_name }}
          draft: false
          prerelease: true
          files: |
            ${{ steps.meta.outputs.zip_name }}
            LICENSE.md
